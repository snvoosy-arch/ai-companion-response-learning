name: Rubrum portfolio CI

on:
  push:
    paths:
      - "README.md"
      - "docs/rubrum-*.md"
      - "companions/rubrum/**"
      - ".github/workflows/rubrum-portfolio-ci.yml"
  pull_request:
    paths:
      - "README.md"
      - "docs/rubrum-*.md"
      - "companions/rubrum/**"
      - ".github/workflows/rubrum-portfolio-ci.yml"

jobs:
  public-slice:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companions/rubrum

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install static checker
        run: python -m pip install ruff==0.12.11

      - name: Run public CPU vertical slice
        run: python -m examples.rubrum_vertical_slice.demo --all --json --output "$RUNNER_TEMP/rubrum-vertical-slice.json"

      - name: Verify vertical slice trace and authority boundaries
        run: python scripts/verify_vertical_slice_trace.py "$RUNNER_TEMP/rubrum-vertical-slice.json"

      - name: Run dependency-free tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Audit public files and links
        run: python scripts/audit_public_portfolio.py

      - name: Validate public evidence JSON syntax
        run: python -m json.tool evidence/rubrum-experiment-summary.json > /dev/null

      - name: Lint current Rubrum public code
        run: ruff check examples tests scripts
