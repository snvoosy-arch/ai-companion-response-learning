name: Sapphirus portfolio checks

on:
  push:
    paths:
      - "README.md"
      - "companions/README.md"
      - "companions/sapphirus/**"
      - "docs/sapphirus-*"
      - "docs/assets/sapphirus-*"
      - "evidence/**"
      - "examples/sapphirus_external_first/**"
      - "scripts/check_sapphirus_portfolio.py"
      - ".github/workflows/sapphirus-portfolio.yml"
  pull_request:
    paths:
      - "README.md"
      - "companions/README.md"
      - "companions/sapphirus/**"
      - "docs/sapphirus-*"
      - "docs/assets/sapphirus-*"
      - "evidence/**"
      - "examples/sapphirus_external_first/**"
      - "scripts/check_sapphirus_portfolio.py"
      - ".github/workflows/sapphirus-portfolio.yml"

permissions:
  contents: read

jobs:
  verify-public-slice:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pinned lint dependency
        run: python -m pip install --disable-pip-version-check ruff==0.15.8
      - name: Compile the public Sapphirus slice
        run: >-
          python -m compileall -q
          examples/sapphirus_external_first
          scripts/check_sapphirus_portfolio.py
      - name: Run Ruff
        run: >-
          python -m ruff check
          examples/sapphirus_external_first
          scripts/check_sapphirus_portfolio.py
      - name: Run contract tests
        run: python -m unittest discover -s examples/sapphirus_external_first/tests -v
      - name: Validate links, evidence, and public boundaries
        run: python scripts/check_sapphirus_portfolio.py
      - name: Run the CPU demonstration
        run: python -m examples.sapphirus_external_first.demo

  verify-functional-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Compile and test RAG without model requests
        working-directory: companions/sapphirus/rag
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src tests run_lab.py
          python -m unittest discover -s tests -v
          python run_lab.py demo
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install pinned Minecraft dependencies
        working-directory: companions/sapphirus/minecraft
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check and test Minecraft without connecting
        working-directory: companions/sapphirus/minecraft
        run: |
          npm run check
          npm test
